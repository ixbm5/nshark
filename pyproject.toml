[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nshark"
version = "1.0.0"
description = "Fast PCAP Analysis, Hash Extraction & Threat Intel CLI."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = [
    "pcap",
    "dfir",
    "threat-hunting",
    "mitre-attack",
    "network-forensics",
    "incident-response",
    "soc",
    "security",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0,<3.0.0",
    "rich>=13.0.0,<15.0.0",
    "click>=8.1.0,<9.0.0",
    "requests>=2.31.0,<3.0.0",
    "pyyaml>=6.0,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "geoip2>=4.7.0,<6.0.0",
    "dpkt>=1.9.8,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.8.0,<1.20.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/ixbm5/nshark"
Repository = "https://github.com/ixbm5/nshark"
Security = "https://github.com/ixbm5/nshark/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
include = ["nshark*"]

[project.scripts]
nshark = "nshark.cli:main"

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped", "attr-defined"]


