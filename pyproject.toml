[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nshark"
version = "1.0.0"
description = "Fast PCAP Analysis & Threat Intel CLI."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["pcap", "nshark", "soc", "incident-response", "network-security", "dfir"]
dependencies = [
    "scapy>=2.5.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "geoip2>=4.7.0",
    "dpkt>=1.9.8",
]

[tool.setuptools.packages.find]
include = ["nshark*"]

[project.scripts]
nshark = "nshark.cli:main"
